plugins {
    id 'com.android.application'
}

android {
    namespace 'site.je.lyvo'
    compileSdk 34

    defaultConfig {
        applicationId 'site.je.lyvo'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signé avec la clé de debug : suffisant pour tester entre amis.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
